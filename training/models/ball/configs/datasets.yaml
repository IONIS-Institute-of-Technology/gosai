# Roboflow datasets to download and merge into the single-class "ball" dataset.
#
# Add more by appending entries. Each is parsed from a Roboflow Universe URL:
#   https://universe.roboflow.com/<workspace>/<project>/
# `version` is an integer pin (see the project's Versions page) or `latest`.
# `latest` downloads the newest version and warns: pin the number it prints so a
# training run can be reproduced. The downloaded version is recorded in
# raw/<name>/gosai-dataset.json; `download` refuses a folder holding a version
# other than the pinned one.
#
# Per-dataset knobs (all optional):
#   enabled: false          skip the dataset entirely (download and prepare)
#   cap: N                  keep at most N images (deterministic, positives
#                           first) so one big dataset cannot dominate the merge
#   trust_negatives: false  do NOT turn the dataset's no-ball frames into
#                           negatives (use for sloppily-labelled sets where an
#                           empty label file may just mean "nobody labelled it")

format: yolov11 # Roboflow export format (YOLO bbox; yolov11 == yolov8 layout)

datasets:
  - name: billiard-8
    workspace: object-detection-billiard
    project: billiard-8
    version: latest # TODO: pin once the version behind the shipped ball.onnx is known

  - name: wdzpn
    workspace: '-ahcxq'
    project: '-wdzpn'
    version: latest # TODO: pin once the version behind the shipped ball.onnx is known

  # Sloppy labelling (junk class names, unlabelled stock photos): its no-ball
  # frames cannot be trusted as negatives.
  - name: pool-v2
    workspace: pool-table
    project: pool-v2
    version: latest # TODO: pin once the version behind the shipped ball.onnx is known
    trust_negatives: false

  # Broadcast side-view snooker: useful variety, but a domain mismatch with a
  # top-down pool camera -- capped so pool footage dominates the merge.
  - name: snooker-vision
    workspace: morganlewis
    project: snooker-vision-tjn0z
    version: latest # TODO: pin once the version behind the shipped ball.onnx is known
    cap: 800
