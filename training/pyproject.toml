[project]
name = "gosai-train"
version = "0.1.0"
description = "Training pipelines for GOSAI driver models"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "GPL-3.0" }
authors = [{ name = "GOSAI" }]

dependencies = [
    "ultralytics>=8.4.100",
    # torch/torchvision are ultralytics deps, but we declare them explicitly so
    # the per-platform index pins below apply (PyPI torch is CPU-only on
    # Windows; >=2.7 is the first release with CUDA 12.8 / Blackwell support).
    "torch>=2.7",
    "torchvision>=0.22",
    # Ultralytics auto-applies extra photometric augmentations (blur, CLAHE,
    # grayscale) during training when albumentations is importable.
    "albumentations>=1.4.0",
    "roboflow>=1.3.0",
    "onnx>=1.22.0",
    "onnxslim>=0.1.90",
    "onnxruntime>=1.27.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# CoreML export (.mlpackage) for Apple Neural Engine. Install with:
#   uv sync --extra coreml
# (TensorRT export to .engine needs no extra: Ultralytics installs `tensorrt`
#  on demand during `gosai-train export --formats engine` on a CUDA machine.)
coreml = ["coremltools>=8.1"]
# Optional external negative sources in negatives.yaml (Google Drive, direct URLs):
#   uv sync --extra negatives
negatives = ["requests>=2.31", "gdown>=5.2.0"]

[dependency-groups]
# pyyaml, rich and numpy let the unit tests import the pipeline without the ML
# stack, so CI can run `uv run --only-group dev pytest` without downloading torch.
# OpenCV runs the export's letterbox in its test; albumentations already brings
# the headless build into the full environment.
dev = [
    "ruff>=0.16.8",
    "pytest>=9.1.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "numpy>=2.0",
    "opencv-python-headless>=5.0",
]

[project.scripts]
gosai-train = "gosai_train.cli:main"

# Per-platform torch resolution: on Windows, PyPI ships CPU-only torch wheels,
# so pull the CUDA 12.8 builds from the PyTorch index instead (also what the
# RTX 50xx/Blackwell cards require). Linux PyPI wheels already bundle CUDA and
# macOS wheels ship MPS, so both keep resolving from PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gosai_train"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
