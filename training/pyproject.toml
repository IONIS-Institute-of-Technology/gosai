[project]
name = "gosai-train"
version = "0.1.0"
description = "Training pipeline for the GOSAI single-class billiard-ball detector (YOLO26)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "GPL-3.0" }
authors = [{ name = "GOSAI" }]

dependencies = [
    "ultralytics>=8.4.100",
    "roboflow>=1.3.0",
    "onnx>=1.22.0",
    "onnxslim>=0.1.90",
    "onnxruntime>=1.27.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "requests>=2.31",
    "gdown>=5.2.0",
]

[project.optional-dependencies]
# CoreML export (.mlpackage) for Apple Neural Engine. Install with:
#   uv sync --extra coreml
# (TensorRT export to .engine needs no extra: Ultralytics installs `tensorrt`
#  on demand during `gosai-train export --formats engine` on a CUDA machine.)
coreml = ["coremltools>=8.1"]
dev = ["ruff>=0.15.0"]

[project.scripts]
gosai-train = "gosai_train.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gosai_train"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
