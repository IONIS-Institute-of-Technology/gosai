[project]
name = "gosai-py"
version = "0.1.0"
description = "Python runtime and SDK for GOSAI"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "GPL-3.0" }
authors = [{ name = "GOSAI" }]

dependencies = [
    "numpy>=2.1.0",
    "msgpack>=1.1.0",
    "opencv-python>=4.10.0",
    "mediapipe>=0.10.33",
    "pillow>=11.0.0",
    "onnxruntime>=1.20.0; sys_platform == 'darwin'",
    "onnxruntime-gpu>=1.20.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "sounddevice>=0.5.0",
    "soundfile>=0.13.0",
]

[project.optional-dependencies]
realsense = [
    "pyrealsense2>=2.55.0",
]
speech = [
    "faster-whisper>=1.1.0",
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "scipy>=1.14.0",
]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pyright>=1.1.390",
]

[project.scripts]
gosai-bridge = "gosai_py.bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gosai_py"]
artifacts = ["src/gosai_py/drivers/slr_models/*.onnx"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
