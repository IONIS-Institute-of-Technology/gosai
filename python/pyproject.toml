[project]
name = "gosai-py"
version = "0.1.0"
description = "Python runtime and SDK for GOSAI"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "GPL-3.0" }
authors = [{ name = "GOSAI" }]

dependencies = [
    "numpy>=2.5.0",
    "msgpack>=1.2.0",
    "opencv-contrib-python>=5.0.0",
    "mediapipe>=0.10.35",
    "pillow>=12.0.0",
    "onnxruntime>=1.27.0; sys_platform == 'darwin'",
    "onnxruntime-gpu[cuda,cudnn]>=1.26.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "sounddevice>=0.5.0",
    "soundfile>=0.14.0",
]

[project.optional-dependencies]
realsense = [
    "pyrealsense2>=2.55.0",
]
speech = [
    "faster-whisper>=1.1.0",
    "torch>=2.13.0",
    "torchaudio>=2.9.0",
    "scipy>=1.17.0",
]
dev = [
    "ruff>=0.15.0",
    "pytest>=9.0.0",
    "pyright>=1.1.411",
]

[project.scripts]
gosai-bridge = "gosai_py.bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gosai_py"]
artifacts = [
    "src/gosai_py/drivers/slr_models/*.onnx",
    "src/gosai_py/drivers/ball_models/*.onnx",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
