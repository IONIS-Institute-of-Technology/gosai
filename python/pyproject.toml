[project]
name = "gosai-py"
version = "0.1.0"
description = "Python runtime and SDK for GOSAI"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "GPL-3.0" }
authors = [{ name = "GOSAI" }]

dependencies = [
    "numpy>=2.5.0",
    "opencv-contrib-python>=5.0.0",
    "mediapipe>=1.0.1",
    "sounddevice>=0.5.0",
]

[project.optional-dependencies]
# NVIDIA GPUs. Replaces the default `cpu` group: `uv sync --extra gpu --no-group cpu`.
gpu = [
    "onnxruntime-gpu[cuda,cudnn]>=1.26.0; sys_platform == 'linux' or sys_platform == 'win32'",
]
realsense = [
    "pyrealsense2>=2.55.0; sys_platform != 'darwin'",
]
speech = [
    "faster-whisper>=1.1.0",
    "torch>=2.13.0",
]
[dependency-groups]
# CPU build of ONNX Runtime, installed by default. macOS builds include CoreML.
cpu = [
    "onnxruntime>=1.26.0",
]
dev = [
    "ruff>=0.16.8",
    "pytest>=9.1.1",
    "pyright>=1.1.414",
]

[tool.uv]
default-groups = ["cpu", "dev"]
# onnxruntime and onnxruntime-gpu install the same `onnxruntime` module.
conflicts = [[{ group = "cpu" }, { extra = "gpu" }]]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[project.scripts]
gosai-bridge = "gosai_py.bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gosai_py"]
artifacts = [
    "src/gosai_py/drivers/slr_models/*.onnx",
    "src/gosai_py/drivers/ball_models/*.onnx",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
