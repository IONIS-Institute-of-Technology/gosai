name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: bun install --frozen-lockfile
      # The server's bridge contract and app environment tests need
      # python/.venv and uv, and fail in CI when either is missing.
      - run: uv sync --locked
        working-directory: python
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  sdk-package:
    name: SDK package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Packs @gosai/sdk with bun pm pack and builds templates/basic against the
      # tarball outside the workspace.
      - run: bun run sdk:check-package

  driver-types:
    name: Driver types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: bun install --frozen-lockfile
      - run: uv sync --locked
        working-directory: python
      # Fails when packages/sdk/src/drivers.generated.ts or docs/drivers.md
      # differ from what the Python driver schemas produce.
      - run: bun run drivers:types:check

  python:
    name: Python (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: macOS arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - name: Fetch the ONNX models for the smoke tests
        working-directory: .
        run: |
          git lfs install --local
          git lfs pull --include="python/src/gosai_py/drivers/slr_models/*.onnx,python/src/gosai_py/drivers/ball_models/ball.onnx"
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pyright
      - run: uv run --locked pytest -q

  training:
    name: Training
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.12'
          enable-cache: false
      - run: uv run --locked --only-group dev ruff check .
      - run: uv run --locked --only-group dev ruff format --check .
      - run: uv run --locked --only-group dev pytest -q
