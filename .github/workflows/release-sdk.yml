name: Release SDK

# Publishes @gosai/sdk to npm with provenance when an sdk-v<version> tag is
# pushed, and creates a GitHub release with the version's changelog entry.
# Desktop releases use v* tags (release.yml), which sdk-v* tags don't match.
#
# Needs an NPM_TOKEN repository secret: an npm automation or granular access
# token with publish rights to the @gosai scope. npm trusted publishing (OIDC,
# no stored token) could replace it once the package exists on npm and this
# workflow is registered as its trusted publisher.
on:
  push:
    tags: ['sdk-v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @gosai/sdk
    runs-on: ubuntu-latest
    permissions:
      # The GitHub release.
      contents: write
      # npm provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Check the tag and read the changelog entry
        id: release
        run: bun scripts/sdk-release.ts --tag "$GITHUB_REF_NAME" --notes "$RUNNER_TEMP/release-notes.md"
      - run: bun run --filter @gosai/sdk typecheck
      - run: bun run --filter @gosai/sdk test
      - name: Build, pack and build the template against the package
        run: bun run sdk:check-package
      - name: Pack
        working-directory: packages/sdk
        run: bun run pack:npm --destination "$RUNNER_TEMP"
      - name: Publish to npm
        run: >-
          npm publish "$RUNNER_TEMP/gosai-sdk-${{ steps.release.outputs.version }}.tgz"
          --provenance --access public --tag ${{ steps.release.outputs.npm-tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create the GitHub release
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --title "@gosai/sdk ${{ steps.release.outputs.version }}"
          --notes-file "$RUNNER_TEMP/release-notes.md"
          ${{ steps.release.outputs.prerelease == 'true' && '--prerelease' || '' }}
          "$RUNNER_TEMP/gosai-sdk-${{ steps.release.outputs.version }}.tgz"
        env:
          GH_TOKEN: ${{ github.token }}
